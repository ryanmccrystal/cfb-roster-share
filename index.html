```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CFB Fantasy Roster Share</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        /* Week tabs */

        .week-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .week-tab {
            padding: 8px 14px;
            border: 1px solid #ccc;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;

        .week-tab:hover {
            background: #eee;
        }

        .week-tab.active {
            background: #222;

            border-color: #222;
        }

        .controls {
            margin-bottom: 15px;
        }

        #search {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        th {
            background: #222;
            color: white;
            padding: 12px 10px;
            text-align: left;
            cursor: pointer;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f0f0f0;
        }

        .share {
            font-weight: bold;
        }

        .points {
            font-weight: bold;
        }

        .updated {
            color: #777;

            margin-top: 15px;
        }

        .error {
            color: #b00020;
            padding: 20px;
            background: #fff0f0;
            border: 1px solid #e0aaaa;
        }

        .not-available {
            padding: 30px;
            background: white;
            text-align: center;
            color: #666;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            th, td {
                padding: 8px 6px;
                font-size: 14px;
            }

            .week-tab {
                padding: 7px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CFB Fantasy Roster Share</h1>

    <div class="subtitle" id="subtitle">
        Loading...
    </div>

    <div class="week-tabs" id="week-tabs"></div>

    <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="Search player, team or position..."
        >
    </div>

    <div id="table-container">
        Loading roster share...
    </div>

    <div class="updated" id="updated"></div>

</div>

<script>

let allWeeks = {};
let players = [];

let currentWeek = 1;

let sortColumn = "Roster Share";
let sortDirection = "desc";


async function loadData() {

    try {

        const response = await fetch("roster_share.json");

        if (!response.ok) {
            throw new Error("Could not load roster_share.json");
        }

        const data = await response.json();

        /*
         * Support the new multi-week format.
         *
         * For now, if the JSON is still using the old
         * single-week format, put that data into Week 1.
         */

        if (data.weeks) {

            allWeeks = data.weeks;

        } else {

            allWeeks = {
                "1": {
                    league_teams: data.league_teams,
                    players: data.players,
                    last_updated: data.last_updated
                }
            };

        }


        createWeekTabs();

        selectWeek(1);

    } catch (error) {

        document.getElementById("table-container").innerHTML =
            `<div class="error">
                Unable to load roster-share data.
            </div>`;

        console.error(error);
    }
}


/*
 * Create Week 1 through Week 14 tabs.
 */

function createWeekTabs() {

    const tabs = document.getElementById("week-tabs");

    tabs.innerHTML = "";

    for (let week = 1; week <= 14; week++) {

        const button = document.createElement("button");

        button.className = "week-tab";

        button.textContent = `Week ${week}`;

        button.onclick = function() {
            selectWeek(week);
        };

        tabs.appendChild(button);
    }
}


/*
 * Select a week.
 */

function selectWeek(week) {

    currentWeek = week;

    /*
     * Update active tab.
     */

    const tabs = document.querySelectorAll(".week-tab");

    tabs.forEach((tab, index) => {

        if (index + 1 === week) {
            tab.classList.add("active");
        } else {
            tab.classList.remove("active");
        }

    });


    /*
     * See whether this week's data exists.
     */

    const weekData = allWeeks[String(week)];


    if (!weekData || !weekData.players) {

        players = [];

        document.getElementById("subtitle").textContent =
            `Week ${week} • Data not available yet`;

        document.getElementById("updated").textContent = "";

        document.getElementById("table-container").innerHTML =
            `<div class="not-available">
                Week ${week} data is not available yet.
            </div>`;

        return;
    }


    /*
     * Load this week's players.
     */

    players = weekData.players;


    document.getElementById("subtitle").textContent =
        `Week ${week} • ${weekData.league_teams} fantasy teams`;


    /*
     * Show last updated time.
     */

    if (weekData.last_updated) {

        const updated = new Date(weekData.last_updated);

        document.getElementById("updated").textContent =
            `Last updated: ${updated.toLocaleString()}`;

    } else {

        document.getElementById("updated").textContent = "";

    }


    /*
     * Reset sorting whenever we change weeks.
     */

    sortColumn = "Roster Share";
    sortDirection = "desc";

    renderTable();
}


/*
 * Render the table.
 */

function renderTable() {

    const searchTerm =
        document.getElementById("search").value.toLowerCase();


    let filteredPlayers = players.filter(player => {

        return (
            player.Player.toLowerCase().includes(searchTerm) ||
            player.Team.toLowerCase().includes(searchTerm) ||
            player.Pos.toLowerCase().includes(searchTerm)
        );

    });


    filteredPlayers.sort((a, b) => {

        let valueA = a[sortColumn];
        let valueB = b[sortColumn];


        /*
         * Handle missing Fantasy Points.
         */

        if (valueA === null || valueA === undefined) {
            valueA = -Infinity;
        }

        if (valueB === null || valueB === undefined) {
            valueB = -Infinity;
        }


        if (typeof valueA === "string") {
            valueA = valueA.toLowerCase();
            valueB = valueB.toLowerCase();
        }


        if (valueA < valueB) {
            return sortDirection === "asc" ? -1 : 1;
        }

        if (valueA > valueB) {
            return sortDirection === "asc" ? 1 : -1;
        }

        return 0;
    });


    let html = `
        <table>

            <thead>
                <tr>
                    <th onclick="sortBy('Rank')">Rank</th>
                    <th onclick="sortBy('Player')">Player</th>
                    <th onclick="sortBy('Team')">Team</th>
                    <th onclick="sortBy('Pos')">Pos</th>
                    <th onclick="sortBy('Teams')">Teams</th>
                    <th onclick="sortBy('Roster Share')">Roster Share</th>
                    <th onclick="sortBy('Fantasy Points')">Fantasy Points</th>
                </tr>
            </thead>

            <tbody>
    `;


    filteredPlayers.forEach((player, index) => {

        const fantasyPoints =
            player["Fantasy Points"] === null ||
            player["Fantasy Points"] === undefined
                ? "—"
                : Number(player["Fantasy Points"]).toFixed(1);


        html += `
            <tr>
                <td>${index + 1}</td>
                <td>${player.Player}</td>
                <td>${player.Team}</td>
                <td>${player.Pos}</td>
                <td>${player.Teams}</td>
                <td class="share">${player["Roster Share"].toFixed(1)}%</td>
                <td class="points">${fantasyPoints}</td>
            </tr>
        `;

    });


    html += `
            </tbody>
        </table>
    `;


    document.getElementById("table-container").innerHTML = html;
}


/*
 * Sort table.
 */

function sortBy(column) {

    if (sortColumn === column) {

        sortDirection =
            sortDirection === "asc" ? "desc" : "asc";

    } else {

        sortColumn = column;
        sortDirection = "desc";

    }

    renderTable();
}


/*
 * Search.
 */

document
    .getElementById("search")
    .addEventListener("input", renderTable);


/*
 * Load the data when the page opens.
 */

loadData();

</script>

</body>
</html>
